spring.application.name=renderia-backend
server.port=${PORT:8080}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,https://renderia-frontend.vercel.app}

# Base de datos (Neon). Los valores reales van en variables de entorno, nunca en GitHub.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/renderia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Las tablas las crea schema.sql del repo renderia-database; Hibernate no las toca.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Permite arrancar aunque la base no responda; /api/v1/health informa el estado.
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Tokens de sesión (JWT). En Render se define JWT_SECRET con un valor largo y secreto.
app.jwt.secret=${JWT_SECRET:renderia-clave-solo-para-desarrollo-local-cambiar}
app.jwt.expiration-hours=24

# Cuenta de administrador inicial (opcional). Se crea solo si ADMIN_EMAIL y ADMIN_PASSWORD existen.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
