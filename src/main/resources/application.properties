spring.application.name=renderia-backend
server.port=${PORT:8080}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,https://renderia-frontend.vercel.app}

# Base de datos (Neon). Los valores reales van en variables de entorno, nunca en GitHub.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/renderia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Las tablas las crea schema.sql del repo renderia-database; Hibernate no las toca.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Permite arrancar aunque la base no responda; /api/v1/health informa el estado.
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Producción: Render define RENDER=true. En producción el backend exige JWT_SECRET
# y confía en la IP que agrega el proxy de Render (X-Forwarded-For).
app.production=${APP_PRODUCTION:${RENDER:false}}
app.behind-proxy=${BEHIND_PROXY:${RENDER:false}}

# Tokens de sesión (JWT). Sin valor por defecto: en producción es obligatoria (32+ caracteres)
# y en local, si falta, se genera una clave aleatoria temporal. Genera una con: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}

# Cuenta de administrador inicial (opcional). Se crea solo si ADMIN_EMAIL y ADMIN_PASSWORD existen.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Planos: tamaño máximo de las imágenes y URL pública del backend para armar los enlaces.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# No mostrar trazas ni mensajes internos en las respuestas de error de Spring.
server.error.include-stacktrace=never
server.error.include-message=never
app.public-url=${RENDER_EXTERNAL_URL:http://localhost:8080}

# Servicio de IA (repositorio renderia-ai)
app.ai.url=${AI_SERVICE_URL:http://localhost:8000}
app.ai.api-key=${AI_API_KEY:}
# Consulta /health de la IA cada 10 minutos mientras el backend está despierto
app.ai.keep-warm=${AI_KEEP_WARM:true}
# Daily per-user limits for the copilot and AI renders (they spend the Gemini quota)
app.ai.copilot-daily-limit=${COPILOT_DAILY_LIMIT:60}
app.ai.copilot-daily-limit-student=${COPILOT_DAILY_LIMIT_STUDENT:20}
app.ai.render-daily-limit=${RENDER_DAILY_LIMIT:5}

# Cuentas de prueba para la sustentación (opcionales). Se crean solo si se definen sus contraseñas.
app.demo.engineer-password=${DEMO_ENGINEER_PASSWORD:}
app.demo.student-password=${DEMO_STUDENT_PASSWORD:}
